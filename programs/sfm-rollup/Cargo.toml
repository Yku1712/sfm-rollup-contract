[package]
name = "sfm-rollup"
version = "0.1.0"
description = "Merkle Root Verifier for SFM Rollup"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sfm_rollup"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"
