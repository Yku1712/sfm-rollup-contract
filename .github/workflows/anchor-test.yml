name: Solana Contract CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI 0.32.1
        run: |
          cargo install --git https://github.com/coral-xyz/anchor anchor-cli --tag v0.32.1 --force
          anchor --version

      - name: Pin problematic crates to pre-edition2024 versions
        run: |
          cargo update -p zeroize --precise 1.7.0 || true

      - name: Generate test keypair
        run: |
          solana-keygen new --no-bip39-passphrase --silent --outfile $HOME/.config/solana/id.json

      - name: Run Unit Tests
        working-directory: ./programs/sfm-rollup
        run: cargo test

      - name: Build Anchor Program
        run: anchor build
